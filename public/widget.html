<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropMind Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ghost.css">
  <style>
    /* ── Widget page lives INSIDE an iframe sized by /widget.js ──
       Every rule here only affects this document — the host page is untouched. */
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
    }
    #ghost-widget {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }
    .ghost-toggle {
      position: absolute;
      right: 2px; bottom: 2px;
    }
    .ghost-chat-window {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      bottom: 0; right: 0;
      border: none;
      border-radius: 0;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
    }
    body.widget-open .ghost-toggle { display: none; }
  </style>
</head>
<body>
  <div id="ghost-widget">
    <button class="ghost-toggle" id="ghost-toggle" title="Chat with Sarah" aria-label="Open chat">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>
    <div class="ghost-chat-window" id="ghost-chat-window">
      <div class="ghost-header">
        <div class="ghost-header-info">
          <div class="ghost-avatar">S</div>
          <div class="ghost-name-wrap">
            <h3 class="ghost-name">Sarah</h3>
            <p class="ghost-status" id="ghost-status">Online now</p>
          </div>
        </div>
        <button class="ghost-close" id="ghost-close" title="Close">&times;</button>
      </div>
      <div class="ghost-messages" id="ghost-messages">
        <div class="message bot">
          Hey, I'm Sarah. What are you looking for?
          <span class="message-time"></span>
        </div>
        <div class="typing-indicator" id="ghost-typing">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
      <div class="ghost-input-area">
        <form id="ghost-form" class="ghost-input-wrapper">
          <input type="text" id="ghost-input" class="ghost-input" placeholder="Type a message..." autocomplete="off">
          <button type="submit" class="ghost-send" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var agency = new URLSearchParams(window.location.search).get('agency') || '';

    // ── parent ⇄ iframe bridge ──
    function tellParent(type) {
      try {
        window.parent.postMessage({ source: 'propmind-widget', type: type }, '*');
      } catch (e) {}
    }
    window.addEventListener('message', function (event) {
      if (event.data && event.data.source === 'propmind-loader' && event.data.type === 'opened') {
        var input = document.getElementById('ghost-input');
        if (input) input.focus();
      }
    });

    // ── agency identity ──
    fetch('/api/ghost/config' + (agency ? '?agency=' + encodeURIComponent(agency) : ''))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.agencyName) {
          var status = document.getElementById('ghost-status');
          if (status) status.textContent = data.agencyName;
        }
      })
      .catch(function () {});

    // ── notification chime ──
    function playNotification() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        function note(freq, startTime, dur, vol) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
          gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
          gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + startTime);
          osc.stop(ctx.currentTime + startTime + dur);
        }
        note(880, 0, 0.18, 0.12);
        note(1175, 0.08, 0.22, 0.09);
        note(1320, 0.16, 0.28, 0.06);
      } catch (e) {}
    }

    var chatWin   = document.getElementById('ghost-chat-window');
    var toggleBtn = document.getElementById('ghost-toggle');
    var closeBtn  = document.getElementById('ghost-close');
    var form      = document.getElementById('ghost-form');
    var input     = document.getElementById('ghost-input');
    var msgBox    = document.getElementById('ghost-messages');
    var typing    = document.getElementById('ghost-typing');

    var chatHistory = [
      { role: 'assistant', content: "Hey, I'm Sarah. What are you looking for?" }
    ];

    function setOpen(open) {
      chatWin.classList.toggle('active', open);
      document.body.classList.toggle('widget-open', open);
      if (open) setTimeout(function () { input.focus(); }, 120);
    }

    toggleBtn.addEventListener('click', function () {
      setOpen(true);
      tellParent('open');
    });
    closeBtn.addEventListener('click', function () {
      setOpen(false);
      tellParent('close');
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        setOpen(false);
        tellParent('close');
      }
    });

    function formatTime(d) {
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(text, sender) {
      var div = document.createElement('div');
      div.className = 'message ' + sender;
      div.textContent = text;
      var time = document.createElement('span');
      time.className = 'message-time';
      time.textContent = formatTime(new Date());
      div.appendChild(time);
      msgBox.insertBefore(div, typing);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function cleanBotReply(text) {
      return text
        .replace(/\[LEAD_DATA\][\s\S]*?(?=\n|$)/gi, '')
        .replace(/\[LEAD_CAPTURED\].*/gi, '')
        .replace(/```json[\s\S]*?```/g, '')
        .replace(/```[\s\S]*?```/g, '')
        .trim();
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.disabled = true;
      appendMessage(text, 'user');
      chatHistory.push({ role: 'user', content: text });

      typing.classList.add('active');
      msgBox.scrollTop = msgBox.scrollHeight;

      var url = '/api/ghost/chat' + (agency ? '?agency=' + encodeURIComponent(agency) : '');

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var delay = Math.floor(Math.random() * 4000) + 2000;
          setTimeout(function () {
            typing.classList.remove('active');
            input.disabled = false;
            input.focus();
            if (data.reply) {
              var botReply = cleanBotReply(data.reply);
              appendMessage(botReply, 'bot');
              chatHistory.push({ role: 'assistant', content: botReply });
              playNotification();
            }
          }, delay);
        })
        .catch(function () {
          typing.classList.remove('active');
          input.disabled = false;
          appendMessage("Sorry, I'm having a quick connection issue. Please try again in a moment!", 'bot');
        });
    });

    // Tell the loader we're alive.
    tellParent('ready');
  })();
  </script>
</body>
</html>
